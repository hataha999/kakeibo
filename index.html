<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <title>家計簿</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --text: #1e293b;
      --text2: #475569;
      --text3: #94a3b8;
      --accent: #7c3aed;
      --accent-bg: #ede9fe;
      --red: #dc2626;
      --green: #16a34a;
      --radius: 12px;
      --tab-h: 3.5rem;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-tap-highlight-color: transparent;
    }
    #app { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; }

    .page { display: none; min-height: 100vh; flex-direction: column; padding-bottom: calc(var(--tab-h) + 0.5rem); }
    .page.active { display: flex; }

    .page-header {
      position: sticky; top: 0; z-index: 30;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .page-header h1 { font-size: 1.05rem; font-weight: 700; }

    /* TAB BAR */
    .tab-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; height: var(--tab-h);
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; z-index: 40;
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.1rem; border: none; background: none; cursor: pointer;
      color: var(--text3); font-size: 0.58rem; font-weight: 600;
    }
    .tab-icon { font-size: 1.2rem; line-height: 1; }
    .tab-btn.active { color: var(--accent); }

    /* FAB */
    .fab {
      position: fixed; bottom: calc(var(--tab-h) + 0.875rem); right: 1rem;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none; font-size: 1.5rem;
      cursor: pointer; box-shadow: 0 4px 16px rgba(124,58,237,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 45;
    }

    main { flex: 1; padding: 0.75rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.75rem; }
    .section-label { font-size: 0.7rem; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; }

    /* CALENDAR */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 0.25rem; margin-bottom: 0.5rem; }
    .cal-month-label { font-size: 1.05rem; font-weight: 700; }
    .cal-nav-btn { background: none; border: none; font-size: 1.4rem; color: var(--text2); cursor: pointer; padding: 0.2rem 0.6rem; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 0.3rem; }
    .cal-wd { text-align: center; font-size: 0.65rem; font-weight: 700; color: var(--text3); padding: 0.2rem 0; }
    .cal-wd:first-child { color: #ef4444; }
    .cal-wd:last-child { color: #3b82f6; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day {
      min-height: 3.4rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.2rem 0.1rem;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer;
    }
    .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-day.has-exp { background: #f5f3ff; }
    .cal-day.today .cal-day-num {
      background: var(--accent); color: #fff; border-radius: 50%;
      width: 1.4rem; height: 1.4rem;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-day.sunday .cal-day-num { color: #ef4444; }
    .cal-day.saturday .cal-day-num { color: #3b82f6; }
    .cal-day-num { font-size: 0.75rem; font-weight: 600; margin-bottom: 0.1rem; }
    .cal-day-amt { font-size: 0.52rem; color: var(--accent); font-weight: 700; text-align: center; line-height: 1.2; }
    .month-total-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.75rem 1rem; margin-top: 0.75rem;
    }
    .month-total-label { font-size: 0.8rem; color: var(--text2); }
    .month-total-amount { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

    /* LIST */
    .list-nav { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .seg-btns { display: flex; gap: 0.3rem; }
    .seg-btn {
      padding: 0.35rem 0.75rem; border: 1.5px solid var(--border);
      background: var(--surface); border-radius: 6px; color: var(--text2);
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .seg-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .period-nav { display: flex; align-items: center; gap: 0.3rem; margin-left: auto; }
    .period-label { font-size: 0.82rem; font-weight: 600; min-width: 8rem; text-align: center; }
    .period-btn { background: none; border: none; color: var(--text2); font-size: 1.1rem; cursor: pointer; padding: 0.2rem; }

    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.875rem; margin-bottom: 0.75rem; }
    .summary-total { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.6rem; }
    .summary-total span { font-size: 0.8rem; font-weight: 400; color: var(--text2); margin-right: 0.3rem; }
    .cat-bar-row { margin-bottom: 0.4rem; }
    .cat-bar-header { display: flex; justify-content: space-between; font-size: 0.72rem; margin-bottom: 0.2rem; }
    .cat-bar-label { color: var(--text2); }
    .cat-bar-wrap { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .cat-bar { height: 100%; border-radius: 3px; }

    .exp-date-group { margin-bottom: 0.75rem; }
    .exp-date-header {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; color: var(--text2); font-weight: 700;
      padding: 0.2rem 0.25rem; border-bottom: 1px solid var(--border); margin-bottom: 0.35rem;
    }
    .exp-item {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.6rem 0.75rem; margin-bottom: 0.3rem; cursor: pointer;
    }
    .exp-item:active { background: var(--accent-bg); }
    .exp-cat-icon { font-size: 1.1rem; flex-shrink: 0; }
    .exp-info { flex: 1; min-width: 0; }
    .exp-desc { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exp-cat-label { font-size: 0.68rem; color: var(--text3); }
    .exp-amount { font-size: 0.88rem; font-weight: 700; white-space: nowrap; }
    .exp-delete { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 0.9rem; padding: 0.3rem; flex-shrink: 0; }

    /* SUBSCRIPTIONS */
    .subs-total-card {
      background: var(--accent); color: #fff;
      border-radius: var(--radius); padding: 1rem; margin-bottom: 0.75rem;
    }
    .subs-total-label { font-size: 0.78rem; opacity: 0.85; margin-bottom: 0.2rem; }
    .subs-total-amount { font-size: 1.6rem; font-weight: 700; }
    .subs-total-note { font-size: 0.7rem; opacity: 0.75; margin-top: 0.25rem; }
    .sub-item {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem;
    }
    .sub-icon { font-size: 1.2rem; flex-shrink: 0; }
    .sub-info { flex: 1; min-width: 0; }
    .sub-name { font-size: 0.9rem; font-weight: 700; }
    .sub-detail { font-size: 0.7rem; color: var(--text2); margin-top: 0.1rem; }
    .sub-amount { font-size: 0.88rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .sub-quick-btn {
      background: var(--accent-bg); color: var(--accent); border: none; border-radius: 6px;
      padding: 0.3rem 0.5rem; font-size: 0.65rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .sub-edit-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 0.9rem; padding: 0.25rem; }
    .add-dashed-btn {
      width: 100%; padding: 0.75rem; border: 1.5px dashed var(--border);
      background: transparent; border-radius: var(--radius);
      color: var(--text2); font-size: 0.88rem; cursor: pointer; font-weight: 600; margin-top: 0.25rem;
    }

    /* MODALS */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 50; display: none;
    }
    .overlay.open { display: block; }
    .modal {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
      z-index: 60; padding: 1rem 1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
      max-height: 92vh; overflow-y: auto; display: none;
    }
    .modal.open { display: block; }
    .modal-handle { width: 2.5rem; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 1rem; }
    .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }

    .form-group { margin-bottom: 0.875rem; }
    .form-label { display: block; font-size: 0.78rem; color: var(--text2); font-weight: 600; margin-bottom: 0.35rem; }
    input[type="text"], input[type="date"], input[type="number"], select {
      width: 100%; padding: 0.7rem 0.75rem; border: 1.5px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text);
      font-size: 1rem; -webkit-appearance: none; appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .amount-wrap { position: relative; }
    .yen-prefix { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 1rem; color: var(--text2); pointer-events: none; }
    .amount-wrap input { padding-left: 1.75rem; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* Category chips */
    .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
    .cat-chip {
      display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      padding: 0.4rem 0.1rem; border: 1.5px solid var(--border);
      border-radius: 8px; cursor: pointer; background: var(--surface);
    }
    .cat-chip.selected { border-color: var(--accent); background: var(--accent-bg); }
    .cat-chip-icon { font-size: 1.15rem; line-height: 1; }
    .cat-chip-name { font-size: 0.55rem; color: var(--text2); font-weight: 600; }
    .cat-chip.selected .cat-chip-name { color: var(--accent); }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 0.8rem; border-radius: var(--radius);
      font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; margin-top: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: #fee2e2; color: var(--red); border: 1px solid #fecaca; }

    /* Day modal */
    .day-exp-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .day-exp-item:last-child { border-bottom: none; }
    .day-total-row { display: flex; justify-content: space-between; padding-top: 0.5rem; margin-top: 0.25rem; font-weight: 700; font-size: 0.88rem; border-top: 2px solid var(--border); }

    .empty-state { text-align: center; color: var(--text3); padding: 3rem 1rem; font-size: 0.9rem; line-height: 2.2; }

    .toast {
      position: fixed; bottom: calc(var(--tab-h) + 0.75rem); left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff; padding: 0.6rem 1.2rem; border-radius: 9999px;
      font-size: 0.85rem; font-weight: 600; z-index: 200; opacity: 0;
      transition: opacity 0.2s; white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- ① カレンダー -->
  <div id="page-home" class="page active">
    <div class="page-header"><h1>📅 家計簿</h1></div>
    <main>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <div class="cal-wd">日</div><div class="cal-wd">月</div><div class="cal-wd">火</div>
        <div class="cal-wd">水</div><div class="cal-wd">木</div><div class="cal-wd">金</div>
        <div class="cal-wd">土</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="month-total-row">
        <span class="month-total-label">今月の支出合計</span>
        <span class="month-total-amount" id="month-total-amount">¥0</span>
      </div>
    </main>
  </div>

  <!-- ② 一覧 -->
  <div id="page-list" class="page">
    <div class="page-header"><h1>💰 支出一覧</h1></div>
    <main>
      <div class="list-nav">
        <div class="seg-btns" id="mode-btns">
          <button class="seg-btn active" data-mode="month">月別</button>
          <button class="seg-btn" data-mode="week">週別</button>
        </div>
        <div class="period-nav">
          <button class="period-btn" id="period-prev">‹</button>
          <span class="period-label" id="period-label"></span>
          <button class="period-btn" id="period-next">›</button>
        </div>
      </div>
      <div id="list-content"></div>
    </main>
  </div>

  <!-- ③ サブスク -->
  <div id="page-subs" class="page">
    <div class="page-header"><h1>🔄 サブスク管理</h1></div>
    <main>
      <div id="subs-content"></div>
      <button class="add-dashed-btn" id="btn-add-sub">＋ サブスクを追加</button>
    </main>
  </div>

  <!-- タブバー -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="home">
      <span class="tab-icon">📅</span><span>カレンダー</span>
    </button>
    <button class="tab-btn" data-tab="list">
      <span class="tab-icon">📋</span><span>一覧</span>
    </button>
    <button class="tab-btn" data-tab="subs">
      <span class="tab-icon">🔄</span><span>サブスク</span>
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" id="fab">＋</button>

  <!-- オーバーレイ -->
  <div id="overlay" class="overlay"></div>

  <!-- 支出モーダル -->
  <div id="modal-expense" class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="exp-modal-title">支出を追加</div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input type="date" id="exp-date">
    </div>
    <div class="form-group">
      <label class="form-label">カテゴリ</label>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">内容（省略可）</label>
      <input type="text" id="exp-desc" placeholder="例：ランチ" maxlength="30">
    </div>
    <div class="form-group">
      <label class="form-label">金額</label>
      <div class="amount-wrap">
        <span class="yen-prefix">¥</span>
        <input type="number" id="exp-amount" placeholder="0" inputmode="numeric" min="1">
      </div>
    </div>
    <button class="btn btn-primary" id="btn-save-exp">保存</button>
    <button class="btn btn-danger" id="btn-del-exp" style="display:none">この支出を削除</button>
  </div>

  <!-- 日付詳細モーダル -->
  <div id="modal-day" class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="day-modal-title"></div>
    <div id="day-exp-list"></div>
    <button class="btn btn-primary" id="btn-add-day-exp" style="margin-top:0.75rem">＋ この日に追加</button>
  </div>

  <!-- サブスクモーダル -->
  <div id="modal-sub" class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="sub-modal-title">サブスクを追加</div>
    <div class="form-group">
      <label class="form-label">サービス名</label>
      <input type="text" id="sub-name" placeholder="例：Netflix" maxlength="30">
    </div>
    <div class="form-group">
      <label class="form-label">金額</label>
      <div class="amount-wrap">
        <span class="yen-prefix">¥</span>
        <input type="number" id="sub-amount" placeholder="0" inputmode="numeric" min="1">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">サイクル</label>
      <select id="sub-cycle">
        <option value="monthly">毎月</option>
        <option value="yearly">毎年</option>
      </select>
    </div>
    <div class="form-group" id="sub-day-wrap">
      <label class="form-label">引き落とし日</label>
      <input type="number" id="sub-day" placeholder="例：15" min="1" max="31" inputmode="numeric">
    </div>
    <div id="sub-yearly-wrap" style="display:none">
      <div class="form-group">
        <label class="form-label">引き落とし月・日</label>
        <div style="display:flex;gap:0.5rem">
          <input type="number" id="sub-bmonth" placeholder="月（例：6）" min="1" max="12" inputmode="numeric">
          <input type="number" id="sub-bday" placeholder="日（例：15）" min="1" max="31" inputmode="numeric">
        </div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-save-sub">保存</button>
    <button class="btn btn-danger" id="btn-del-sub" style="display:none">このサブスクを削除</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ── CONSTANTS ──
const CATS = [
  { id:'food',  icon:'🍽️', name:'食費',    color:'#f97316' },
  { id:'trans', icon:'🚃',  name:'交通費',  color:'#3b82f6' },
  { id:'fun',   icon:'🎮',  name:'娯楽',    color:'#ec4899' },
  { id:'daily', icon:'🏠',  name:'日用品',  color:'#8b5cf6' },
  { id:'med',   icon:'🏥',  name:'医療',    color:'#ef4444' },
  { id:'tel',   icon:'📱',  name:'通信',    color:'#06b6d4' },
  { id:'util',  icon:'💡',  name:'光熱費',  color:'#f59e0b' },
  { id:'cloth', icon:'👕',  name:'衣類',    color:'#10b981' },
  { id:'sub',   icon:'🔄',  name:'サブスク',color:'#6366f1' },
  { id:'other', icon:'📝',  name:'その他',  color:'#94a3b8' },
];
const DAY_JP = ['日','月','火','水','木','金','土'];

// ── DATA ──
const KEY = 'kakeibo_v1';
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { expenses:[], subscriptions:[] }; }
  catch { return { expenses:[], subscriptions:[] }; }
}
function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ── UTILS ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { return '¥' + Number(n||0).toLocaleString(); }
function fmtK(n) {
  if (!n) return '';
  if (n >= 10000) return '¥' + Math.round(n/1000) + 'k';
  if (n >= 1000) return '¥' + (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return '¥' + n;
}
function catById(id) { return CATS.find(c=>c.id===id) || CATS[CATS.length-1]; }
function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function localDate(dateStr) { return new Date(dateStr + 'T00:00:00'); }
function dateLabel(d) {
  const dt = localDate(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日（${DAY_JP[dt.getDay()]}）`;
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── STATE ──
let calYear, calMonth;
let listMode = 'month';
let listYear, listMonth, listWeekStart;
let editingExpId = null;
let editingSubId = null;
let selectedDate = null;
let activeCat = 'food';

// ── WEEK HELPER ──
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

// ── CALENDAR ──
function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${calYear}年${calMonth+1}月`;
  const data = load();
  const dayTotals = {};
  data.expenses.forEach(e => {
    const d = localDate(e.date);
    if (d.getFullYear()===calYear && d.getMonth()===calMonth) {
      const day = d.getDate();
      dayTotals[day] = (dayTotals[day]||0) + e.amount;
    }
  });
  const monthTotal = Object.values(dayTotals).reduce((s,v)=>s+v,0);
  document.getElementById('month-total-amount').textContent = fmt(monthTotal);

  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const tStr = todayStr();
  let html = '';
  for (let i=0; i<firstDow; i++) html += '<div class="cal-day empty"></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = (firstDow + d - 1) % 7;
    const amt = dayTotals[d] || 0;
    const cls = ['cal-day', amt?'has-exp':'', dateStr===tStr?'today':'', dow===0?'sunday':'', dow===6?'saturday':''].filter(Boolean).join(' ');
    html += `<div class="${cls}" data-date="${dateStr}">
      <div class="cal-day-num">${d}</div>
      ${amt ? `<div class="cal-day-amt">${fmtK(amt)}</div>` : ''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

// ── LIST ──
function summaryHTML(expenses) {
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const byCat = {};
  expenses.forEach(e => { byCat[e.cat]=(byCat[e.cat]||0)+e.amount; });
  const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxAmt = sorted[0]?.[1] || 1;
  const bars = sorted.map(([catId, amt]) => {
    const c = catById(catId);
    const pct = Math.round(amt/maxAmt*100);
    return `<div class="cat-bar-row">
      <div class="cat-bar-header">
        <span class="cat-bar-label">${c.icon} ${c.name}</span>
        <span style="font-size:0.72rem;font-weight:700">${fmt(amt)}</span>
      </div>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;background:${c.color}"></div></div>
    </div>`;
  }).join('');
  return `<div class="summary-card">
    <div class="summary-total"><span>合計</span>${fmt(total)}</div>
    ${bars || '<div style="color:var(--text3);font-size:0.8rem">支出がありません</div>'}
  </div>`;
}

function expenseGroupHTML(expenses) {
  if (!expenses.length) return '<div class="empty-state">📭<br><br>支出がありません</div>';
  const groups = {};
  expenses.forEach(e => { if(!groups[e.date]) groups[e.date]=[]; groups[e.date].push(e); });
  return Object.keys(groups).sort().reverse().map(date => {
    const items = groups[date];
    const dayTotal = items.reduce((s,e)=>s+e.amount,0);
    const itemsHTML = items.map(e => {
      const c = catById(e.cat);
      return `<div class="exp-item" data-id="${e.id}">
        <span class="exp-cat-icon">${c.icon}</span>
        <div class="exp-info">
          <div class="exp-desc">${esc(e.desc||c.name)}</div>
          <div class="exp-cat-label">${c.name}</div>
        </div>
        <span class="exp-amount">${fmt(e.amount)}</span>
        <button class="exp-delete" data-id="${e.id}">✕</button>
      </div>`;
    }).join('');
    return `<div class="exp-date-group">
      <div class="exp-date-header"><span>${dateLabel(date)}</span><span>${fmt(dayTotal)}</span></div>
      ${itemsHTML}
    </div>`;
  }).join('');
}

function renderList() {
  const data = load();
  let expenses;
  if (listMode === 'month') {
    document.getElementById('period-label').textContent = `${listYear}年${listMonth+1}月`;
    expenses = data.expenses.filter(e => {
      const d = localDate(e.date);
      return d.getFullYear()===listYear && d.getMonth()===listMonth;
    });
  } else {
    const ws = listWeekStart;
    const we = new Date(ws); we.setDate(we.getDate()+6);
    document.getElementById('period-label').textContent =
      `${ws.getMonth()+1}/${ws.getDate()}〜${we.getMonth()+1}/${we.getDate()}`;
    expenses = data.expenses.filter(e => {
      const d = localDate(e.date);
      return d >= ws && d <= we;
    });
  }
  document.getElementById('list-content').innerHTML = summaryHTML(expenses) + expenseGroupHTML(expenses);
}

// ── SUBSCRIPTIONS ──
function nextBillingDate(sub) {
  const now = new Date();
  if (sub.cycle === 'monthly') {
    let next = new Date(now.getFullYear(), now.getMonth(), sub.day||1);
    if (next < now) next = new Date(now.getFullYear(), now.getMonth()+1, sub.day||1);
    return `${next.getMonth()+1}月${next.getDate()}日`;
  } else {
    const bm = (sub.month||1)-1, bd = sub.day||1;
    let next = new Date(now.getFullYear(), bm, bd);
    if (next < now) next = new Date(now.getFullYear()+1, bm, bd);
    return `${next.getFullYear()}/${next.getMonth()+1}/${next.getDate()}`;
  }
}

function renderSubs() {
  const data = load();
  const subs = data.subscriptions || [];
  const monthlyTotal = subs.reduce((s,sub) => {
    return s + (sub.cycle==='monthly' ? sub.amount : Math.round(sub.amount/12));
  }, 0);
  const yearlyTotal = subs.filter(s=>s.cycle==='yearly').reduce((s,sub)=>s+sub.amount,0);

  const totalCard = `<div class="subs-total-card">
    <div class="subs-total-label">月あたりの合計</div>
    <div class="subs-total-amount">${fmt(monthlyTotal)}<span style="font-size:0.9rem;opacity:0.8">/月</span></div>
    ${yearlyTotal ? `<div class="subs-total-note">年払い含む（${fmt(yearlyTotal)}/年）</div>` : ''}
  </div>`;

  const subItems = subs.length ? subs.map(sub => {
    const cycleLabel = sub.cycle==='monthly' ? `毎月${sub.day||'?'}日` : `毎年${sub.month||'?'}月${sub.day||'?'}日`;
    const nextLabel = nextBillingDate(sub);
    return `<div class="sub-item">
      <span class="sub-icon">🔄</span>
      <div class="sub-info">
        <div class="sub-name">${esc(sub.name)}</div>
        <div class="sub-detail">${cycleLabel}　次回: ${nextLabel}</div>
      </div>
      <span class="sub-amount">${fmt(sub.amount)}</span>
      <button class="sub-quick-btn" data-sub-id="${sub.id}">追加</button>
      <button class="sub-edit-btn" data-sub-id="${sub.id}">✏️</button>
    </div>`;
  }).join('') : '<div class="empty-state">🔄<br><br>サブスクがありません</div>';

  document.getElementById('subs-content').innerHTML = totalCard + subItems;
}

// ── MODALS ──
function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  if (!document.querySelector('.modal.open')) document.getElementById('overlay').classList.remove('open');
}
function closeAllModals() {
  document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
  document.getElementById('overlay').classList.remove('open');
}

function openExpModal(expId, prefillDate) {
  editingExpId = expId || null;
  const isEdit = !!expId;
  document.getElementById('exp-modal-title').textContent = isEdit ? '支出を編集' : '支出を追加';
  document.getElementById('btn-save-exp').textContent = isEdit ? '保存' : '追加';
  document.getElementById('btn-del-exp').style.display = isEdit ? '' : 'none';

  if (isEdit) {
    const exp = load().expenses.find(e=>e.id===expId);
    if (!exp) return;
    document.getElementById('exp-date').value = exp.date;
    document.getElementById('exp-desc').value = exp.desc || '';
    document.getElementById('exp-amount').value = exp.amount;
    activeCat = exp.cat;
  } else {
    document.getElementById('exp-date').value = prefillDate || todayStr();
    document.getElementById('exp-desc').value = '';
    document.getElementById('exp-amount').value = '';
    activeCat = 'food';
  }
  renderCatChips();
  openModal('modal-expense');
  setTimeout(() => document.getElementById('exp-amount').focus(), 300);
}

function renderCatChips() {
  document.getElementById('cat-grid').innerHTML = CATS.map(c => `
    <div class="cat-chip ${activeCat===c.id?'selected':''}" data-cat="${c.id}">
      <span class="cat-chip-icon">${c.icon}</span>
      <span class="cat-chip-name">${c.name}</span>
    </div>`).join('');
}

function saveExpense() {
  const date = document.getElementById('exp-date').value;
  const desc = document.getElementById('exp-desc').value.trim();
  const amount = parseInt(document.getElementById('exp-amount').value, 10);
  if (!date) { showToast('日付を選択してください'); return; }
  if (!amount || amount <= 0) { showToast('金額を入力してください'); return; }

  const data = load();
  if (editingExpId) {
    const exp = data.expenses.find(e=>e.id===editingExpId);
    if (exp) { exp.date=date; exp.cat=activeCat; exp.desc=desc; exp.amount=amount; }
  } else {
    data.expenses.push({ id:genId(), date, cat:activeCat, desc, amount });
  }
  save(data);
  closeAllModals();
  refresh();
  showToast(editingExpId ? '更新しました' : '追加しました');
}

function deleteExpense(id) {
  if (!confirm('この支出を削除しますか？')) return;
  const data = load();
  data.expenses = data.expenses.filter(e=>e.id!==id);
  save(data);
  closeAllModals();
  refresh();
  showToast('削除しました');
}

function openDayModal(dateStr) {
  selectedDate = dateStr;
  document.getElementById('day-modal-title').textContent = dateLabel(dateStr);
  const expenses = load().expenses.filter(e=>e.date===dateStr);
  if (!expenses.length) {
    document.getElementById('day-exp-list').innerHTML = '<div style="color:var(--text3);font-size:0.85rem;padding:0.5rem 0">支出なし</div>';
  } else {
    const total = expenses.reduce((s,e)=>s+e.amount,0);
    const items = expenses.map(e => {
      const c = catById(e.cat);
      return `<div class="day-exp-item" data-id="${e.id}" style="cursor:pointer">
        <span style="font-size:1.1rem">${c.icon}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:0.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.desc||c.name)}</div>
          <div style="font-size:0.68rem;color:var(--text3)">${c.name}</div>
        </div>
        <span style="font-size:0.88rem;font-weight:700">${fmt(e.amount)}</span>
      </div>`;
    }).join('');
    document.getElementById('day-exp-list').innerHTML = items +
      `<div class="day-total-row"><span>合計</span><span style="color:var(--accent)">${fmt(total)}</span></div>`;
  }
  closeModal('modal-expense');
  openModal('modal-day');
}

function openSubModal(subId) {
  editingSubId = subId || null;
  const isEdit = !!subId;
  document.getElementById('sub-modal-title').textContent = isEdit ? 'サブスクを編集' : 'サブスクを追加';
  document.getElementById('btn-del-sub').style.display = isEdit ? '' : 'none';
  if (isEdit) {
    const sub = load().subscriptions.find(s=>s.id===subId);
    if (!sub) return;
    document.getElementById('sub-name').value = sub.name;
    document.getElementById('sub-amount').value = sub.amount;
    document.getElementById('sub-cycle').value = sub.cycle;
    document.getElementById('sub-day').value = sub.day||'';
    document.getElementById('sub-bmonth').value = sub.month||'';
    document.getElementById('sub-bday').value = sub.bday||sub.day||'';
    toggleSubCycleFields(sub.cycle);
  } else {
    document.getElementById('sub-name').value = '';
    document.getElementById('sub-amount').value = '';
    document.getElementById('sub-cycle').value = 'monthly';
    document.getElementById('sub-day').value = '';
    document.getElementById('sub-bmonth').value = '';
    document.getElementById('sub-bday').value = '';
    toggleSubCycleFields('monthly');
  }
  openModal('modal-sub');
}

function toggleSubCycleFields(cycle) {
  document.getElementById('sub-day-wrap').style.display = cycle==='monthly' ? '' : 'none';
  document.getElementById('sub-yearly-wrap').style.display = cycle==='yearly' ? '' : 'none';
}

function saveSub() {
  const name = document.getElementById('sub-name').value.trim();
  const amount = parseInt(document.getElementById('sub-amount').value, 10);
  const cycle = document.getElementById('sub-cycle').value;
  if (!name) { showToast('サービス名を入力してください'); return; }
  if (!amount || amount <= 0) { showToast('金額を入力してください'); return; }

  const data = load();
  if (!data.subscriptions) data.subscriptions = [];
  if (editingSubId) {
    const sub = data.subscriptions.find(s=>s.id===editingSubId);
    if (sub) {
      sub.name=name; sub.amount=amount; sub.cycle=cycle;
      if (cycle==='monthly') sub.day=parseInt(document.getElementById('sub-day').value)||1;
      else { sub.month=parseInt(document.getElementById('sub-bmonth').value)||1; sub.day=parseInt(document.getElementById('sub-bday').value)||1; }
    }
  } else {
    const sub = { id:genId(), name, amount, cycle };
    if (cycle==='monthly') sub.day = parseInt(document.getElementById('sub-day').value)||1;
    else { sub.month=parseInt(document.getElementById('sub-bmonth').value)||1; sub.day=parseInt(document.getElementById('sub-bday').value)||1; }
    data.subscriptions.push(sub);
  }
  save(data); closeAllModals(); renderSubs();
  showToast(editingSubId ? '更新しました' : '追加しました');
}

function deleteSub(id) {
  if (!confirm('このサブスクを削除しますか？')) return;
  const data = load();
  data.subscriptions = (data.subscriptions||[]).filter(s=>s.id!==id);
  save(data); closeAllModals(); renderSubs(); showToast('削除しました');
}

function addSubAsExpense(subId) {
  const sub = (load().subscriptions||[]).find(s=>s.id===subId);
  if (!sub) return;
  const data = load();
  data.expenses.push({ id:genId(), date:todayStr(), cat:'sub', desc:sub.name, amount:sub.amount });
  save(data); refresh(); showToast(`${sub.name} を支出に追加しました`);
}

// ── REFRESH ──
function refresh() {
  renderCalendar();
  renderList();
  renderSubs();
}

// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('page-'+tab).classList.add('active');
  window.scrollTo(0,0);
}

// ── LISTENERS ──
function initListeners() {
  // Tab bar
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // FAB → open expense modal
  document.getElementById('fab').addEventListener('click', () => openExpModal());

  // Calendar nav
  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonth--; if (calMonth<0) { calMonth=11; calYear--; } renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    calMonth++; if (calMonth>11) { calMonth=0; calYear++; } renderCalendar();
  });

  // Calendar day click
  document.getElementById('cal-grid').addEventListener('click', e => {
    const day = e.target.closest('.cal-day:not(.empty)');
    if (day) openDayModal(day.dataset.date);
  });

  // List mode toggle
  document.getElementById('mode-btns').addEventListener('click', e => {
    const btn = e.target.closest('.seg-btn');
    if (!btn) return;
    listMode = btn.dataset.mode;
    document.querySelectorAll('#mode-btns .seg-btn').forEach(b => b.classList.toggle('active', b===btn));
    renderList();
  });

  // Period navigation
  document.getElementById('period-prev').addEventListener('click', () => {
    if (listMode==='month') {
      listMonth--; if (listMonth<0) { listMonth=11; listYear--; }
    } else {
      listWeekStart.setDate(listWeekStart.getDate()-7);
    }
    renderList();
  });
  document.getElementById('period-next').addEventListener('click', () => {
    if (listMode==='month') {
      listMonth++; if (listMonth>11) { listMonth=0; listYear++; }
    } else {
      listWeekStart.setDate(listWeekStart.getDate()+7);
    }
    renderList();
  });

  // Expense list: edit or delete
  document.getElementById('list-content').addEventListener('click', e => {
    const del = e.target.closest('.exp-delete');
    if (del) { deleteExpense(del.dataset.id); return; }
    const item = e.target.closest('.exp-item');
    if (item) openExpModal(item.dataset.id);
  });

  // Cat chip selection in expense modal
  document.getElementById('cat-grid').addEventListener('click', e => {
    const chip = e.target.closest('.cat-chip');
    if (!chip) return;
    activeCat = chip.dataset.cat;
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('selected', c.dataset.cat===activeCat));
  });

  // Save / delete expense
  document.getElementById('btn-save-exp').addEventListener('click', saveExpense);
  document.getElementById('btn-del-exp').addEventListener('click', () => deleteExpense(editingExpId));

  // Day modal: add to this day
  document.getElementById('btn-add-day-exp').addEventListener('click', () => {
    closeModal('modal-day');
    openExpModal(null, selectedDate);
  });
  // Day modal: click expense to edit
  document.getElementById('day-exp-list').addEventListener('click', e => {
    const item = e.target.closest('[data-id]');
    if (item) { closeModal('modal-day'); openExpModal(item.dataset.id); }
  });

  // Sub buttons
  document.getElementById('btn-add-sub').addEventListener('click', () => openSubModal());
  document.getElementById('btn-save-sub').addEventListener('click', saveSub);
  document.getElementById('btn-del-sub').addEventListener('click', () => deleteSub(editingSubId));
  document.getElementById('sub-cycle').addEventListener('change', e => toggleSubCycleFields(e.target.value));

  // Subs content delegation
  document.getElementById('subs-content').addEventListener('click', e => {
    const quickBtn = e.target.closest('.sub-quick-btn');
    if (quickBtn) { addSubAsExpense(quickBtn.dataset.subId); return; }
    const editBtn = e.target.closest('.sub-edit-btn');
    if (editBtn) openSubModal(editBtn.dataset.subId);
  });

  // Overlay / modal close
  document.getElementById('overlay').addEventListener('click', closeAllModals);
}

// ── INIT ──
function init() {
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  listYear = now.getFullYear(); listMonth = now.getMonth();
  listWeekStart = getWeekStart(now);

  renderCalendar();
  renderList();
  renderSubs();
  initListeners();
}

init();

if ('serviceWorker' in navigator) {
  try {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js');
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) window.location.reload();
    });
  } catch(e) {}
}
</script>
